# regression fixture for completion-safe parsing edge cases
Host alpha beta,*.wild,!negated
  HostName alpha.internal
  User alice
  Port 2222
  UserKnownHostsFile none ~/.ssh/kh_alpha

Match host prod,*.skip originalhost orig.example user deploy sessiontype shell tagged ""
  ProxyJump bastion.example
  GlobalKnownHostsFile /etc/ssh/kh_prod

Match !host bad.example host good.example
  User gooduser

Match exec "sh -c 'echo side-effect >/tmp/should-not-exist-carapace-ssh'"
  Host gated-by-exec
  User gated

Match command "" host cmd-empty
  HostName cmd.example

Include includes/extra.conf
Include edge-includes/inc.conf
Include missing.conf
